[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael"
version = "0.1.0"
description = "Raphael voice assistant backend: streaming STT -> LLM -> TTS over one WebSocket"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=13",
    "anthropic>=0.70",
    "openai>=1.50",
]

[project.optional-dependencies]
# Laptop test client (mic + speaker)
client = ["sounddevice>=0.5", "numpy>=1.26", "sherpa-onnx>=1.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["raphael*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
