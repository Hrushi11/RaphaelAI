[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-mcp"
version = "0.1.0"
description = "An MCP server for android automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "Pillow>=10.0.0",
]

[tool.setuptools]
py-modules = ["server", "adbdevicemanager"]
